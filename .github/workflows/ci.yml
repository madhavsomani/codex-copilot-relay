name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run probe:codex-heartbeat
      - if: runner.os == 'Windows'
        name: PowerShell configuration safety tests
        shell: powershell
        run: .\proxy-config.test.ps1
      - if: runner.os == 'Windows'
        name: Parse every PowerShell script
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) {
              $failed = $true
              $errors | ForEach-Object { Write-Error $_.Message }
            }
          }
          if ($failed) { exit 1 }
